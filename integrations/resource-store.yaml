      priority: critical
      install: curl -fsSL https://raw.githubusercontent.com/colbymchenry/codegraph/main/install.sh | sh
      mcp: true
      description: "Pre-indexed code graph, 20+ languages, auto-sync"
    - name: Gortex
      url: https://github.com/zzet/gortex
      stars: 255
