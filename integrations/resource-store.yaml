# Software Factory — Resource Store
# All repositories, tools, and resources available for use

repositories:
  # ================================================================
  # AGENT HARNESSES
  # ================================================================
  agent_harnesses:
    - name: CodeWhale
      url: https://github.com/Hmbown/CodeWhale
      stars: 38500
      category: agent
      priority: high
      install: npm i -g codewhale
      mcp: true
      description: "Rust TUI/CLI agent harness, 25 providers, OS sandboxing"
    - name: Mercury Agent
      url: https://github.com/cosmicstack-labs/mercury-agent
      stars: 2600
      category: agent
      priority: high
      install: npm i -g @cosmicstack/mercury-agent
      mcp: false
      description: "24/7 daemon, Telegram, Second Brain memory, Kanban"
    - name: Claw Code
      url: https://github.com/ultraworkers/claw-code
      stars: 194000
      category: agent
      priority: medium
      install: cargo install --path .
      mcp: false
      description: "Rust CLI agent harness, Gajae-Code ecosystem"
    - name: Archon
      url: https://github.com/coleam00/Archon
      stars: 22400
      category: agent
      priority: high
      install: curl -fsSL https://archon.diy/install | bash
      mcp: false
      description: "Deterministic AI coding workflows, YAML DAGs"

  # ================================================================
  # CODE INTELLIGENCE
  # ================================================================
  code_intelligence:
    - name: CodeGraph
      url: https://github.com/colbymchenry/codegraph
