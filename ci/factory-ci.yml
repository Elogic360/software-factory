name: Software Factory CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run Factory Doctor
        run: |
          python factory.py doctor

      - name: Run Factory Validation
        run: |
          python factory.py validate

      - name: Run Unit Tests
        run: |
          pytest tests/ -v
